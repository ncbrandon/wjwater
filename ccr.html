<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 CCR Report</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevents double scrollbars */
            font-family: sans-serif;
        }

        object {
            width: 100%;
            height: 100vh;
            display: block;
        }

        /* Fallback styling for mobile browsers that won't show the PDF inline */
        .fallback-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .download-btn {
            padding: 15px 30px;
            background-color: #0056b3;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <object data="https://raw.githubusercontent.com/ncbrandon/wjwater/master/2025CCR.pdf" type="application/pdf">
        <div class="fallback-container">
            <p>Your browser doesn't support viewing this PDF directly.</p>
            <a href="https://raw.githubusercontent.com/ncbrandon/wjwater/master/2025CCR.pdf" class="download-btn">
                View 2025 CCR Report
            </a>
        </div>
    </object>

</body>
</html>
